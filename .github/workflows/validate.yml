name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dotfiles:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the dependency bundle
        run: brew bundle list --file=Brewfile >/dev/null

      - name: Install validation tools
        run: brew install bat fzf stow starship tmux zoxide

      - name: Check Zsh syntax
        run: |
          zsh -n \
            .zshenv \
            .zshrc \
            .config/zsh/.zshenv \
            .config/zsh/.zshrc \
            .config/zsh/aliases.zsh \
            .config/zsh/bindings.zsh \
            .config/zsh/fzf.zsh \
            .config/zsh/plugins.zsh \
            .config/zsh/prompt.zsh \
            .config/agent-sandbox/shell/zshrc \
            .config/agent-sandbox/shell/prompt-spacing.zsh

      - name: Test the man-page pager
        run: zsh tests/manpager.zsh

      - name: Test the command and topic help browsers
        run: python3 tests/man-browser.py

      - name: Test the terminal viewer adapter
        run: zsh tests/terminal-viewer.zsh

      - name: Test global agent instruction links
        run: zsh tests/agent-instructions.zsh

      - name: Test the Copilot reasoning effort default
        run: zsh tests/copilot-effort.zsh

      - name: Test Markdown theme selection
        run: python3 tests/markdown-theme.py

      - name: Test the folded ~/.config migration
        run: python3 tests/unfold-config.py

      - name: Validate Starship configuration
        env:
          STARSHIP_CONFIG: .config/starship.toml
        run: starship print-config >/dev/null

      - name: Preview Stow links
        run: |
          target="$(mktemp -d)"
          mkdir -p "$target/.config"
          stow --simulate --verbose --target="$target" --no-folding .

  pi:
    name: Pi compatibility (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install the verified Pi release
        shell: bash
        run: |
          pi_release="$(cat .config/pi/pi-version)"
          [[ "$pi_release" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          npm install --prefix "$RUNNER_TEMP/shared-pi" --ignore-scripts --no-audit --no-fund --save-exact "@earendil-works/pi-coding-agent@${pi_release}"
          echo "$RUNNER_TEMP/shared-pi/node_modules/.bin" >> "$GITHUB_PATH"
          echo "PI_PACKAGE_ROOT=$RUNNER_TEMP/shared-pi/node_modules/@earendil-works/pi-coding-agent" >> "$GITHUB_ENV"
      - name: Test Pi profiles and blocked updates
        env:
          RUN_PI_GATE_TEST: '1'
        run: node --test tests/pi-profile.test.cjs tests/pi-gate.test.cjs
      - name: Test native renderer behavior
        env:
          TERM: xterm-256color
          FORCE_COLOR: '1'
        run: node .config/pi/checks/renderer-check.mjs
