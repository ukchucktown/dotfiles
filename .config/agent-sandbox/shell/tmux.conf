# Shared behavior for macOS and Agent Sandbox.
set-option -g mouse on
set-option -g focus-events on
set-option -g set-clipboard on
set-option -g escape-time 10
set-option -g history-limit 100000
set-option -g base-index 1
set-option -g renumber-windows on
set-window-option -g pane-base-index 1

# Minimal Subliminal Nightfall status line. The second, empty status row adds
# breathing room between the bar and pane content (tmux cannot size it in px).
set-option -g status 2
set-option -g status-position top
set-option -g status-justify left
set-option -g status-interval 5
set-option -g status-left-length 50
set-option -g status-right-length 40
set-option -g status-style "fg=#7f7f7f,bg=default"
set-option -g @window-tabs-padding 4
set-option -g @window-tabs-stats-width 17
set-option -g @window-tabs-left-decoration-width 8
set-option -g @window-tabs-required-width '#{e|+:#{e|+:#{e|+:#{@window-tabs-left-decoration-width},#{w:#{?#{m/r:^[0-9]+$,#{session_name}},#{s/-[0-9]+$//:host_short},#{session_name}}}},#{w:#{W:#I:#W#{?loop_last_flag,,#{E:window-status-separator}},#I:#W#{?loop_last_flag,,#{E:window-status-separator}}}}},#{e|+:#{@window-tabs-stats-width},#{@window-tabs-padding}}}'
set-option -g status-left "#[fg=#a9b1d6,bold]  #{?#{m/r:^[0-9]+$,#{session_name}},#{s/-[0-9]+$//:host_short},#{session_name}}#[fg=#484e5b,bold]    #{?#{e|<:#{client_width},#{E:@window-tabs-required-width}},#[fg=#e0af68 bold range=user|winmenu]#I:#W#[norange]  ,}"
set-option -g status-right "#{R: ,#{@window-tabs-padding}}#[fg=#a9b1d6,bold]#(if [ -x ~/.config/agent-sandbox/shell/tmux-system-stats ]; then ~/.config/agent-sandbox/shell/tmux-system-stats; else /opt/agent-shell/tmux-system-stats; fi) "
# Moshi clears status-right before attaching. Reapply the shared container
# config through a short-lived client to avoid tmux's hook source-file depth leak.
set-hook -g client-attached 'run-shell -b "test ! -r /opt/agent-shell/tmux.conf || tmux source-file /opt/agent-shell/tmux.conf"'
set-option -g 'status-format[0]' '#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#{?#{e|>=:#{client_width},#{E:@window-tabs-required-width}},#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?loop_last_flag,,#{E:window-status-separator}},#[range=window|#{window_index} list=focus #{E:window-status-current-style}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?loop_last_flag,,#{E:window-status-separator}}}#[nolist],}#[align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]'
set-option -g 'status-format[1]' '#[fg=#2b2e48]#{R:─,#{client_width}}'
if-shell -F '#{>=:#{version},3.4}' 'set-option -g message-line 0'

# Make command mode replace the main bar with an unmistakable prompt.
bind-key : command-prompt -p "TMUX › "

# Show only stable window identity; omit current/previous/zoom flags.
set-option -g window-status-separator "  "
set-option -g window-status-format "#[fg=#a9b1d6,bg=default,bold,nounderscore]#I:#W"
set-option -g window-status-current-format "#[fg=#e0af68,bg=default,bold,nounderscore]#I:#W"

# Open the compact window menu only after a complete click. Mouse-down keeps
# tmux's normal click-to-select behavior for the horizontal window tabs.
bind-key -T root MouseDown1Status if-shell -F '#{!=:#{mouse_status_range},winmenu}' { switch-client -t = }
bind-key -T root MouseUp1Status if-shell -F '#{==:#{mouse_status_range},winmenu}' { run-shell '~/.config/agent-sandbox/shell/tmux-window-menu "#{client_name}" "#{pane_id}" "#{mouse_x}"' }

# Match transient UI and pane borders to the same restrained palette.
set-option -g message-style "fg=#a9b1d6,bg=#15142d,bold,fill=#15142d"
set-option -g message-command-style "fg=#a9b1d6,bg=#15142d,bold,fill=#15142d"
set-option -g mode-style "fg=#03021a,bg=#6699cc"
set-window-option -g copy-mode-position-format ""
# Keep automatic names content-sensitive without renaming a window to [tmux]
# while scrolling or using another tmux pane mode.
set-window-option -g automatic-rename-format '#{pane_current_command}#{?pane_dead,[dead],}'
set-option -g pane-border-style "fg=#2b2e48"
set-option -g pane-active-border-style "fg=#7f7f7f"
set-option -g display-panes-colour "#7f7f7f"
set-option -g display-panes-active-colour "#5fb3b3"
