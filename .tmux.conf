# macOS entry point; the shared file is also mounted into Agent Sandbox.
set-option -g default-terminal tmux-256color
set-option -as terminal-features ",xterm-ghostty:RGB"
source-file ~/.config/agent-sandbox/shell/tmux.conf

# tmux owns mouse events when mouse mode is enabled, so its default right-click
# menu pastes the tmux buffer rather than the macOS clipboard. Import the system
# clipboard and paste it into the pane under the pointer instead.
bind-key -T root MouseDown3Pane select-pane -t = \; run-shell 'pbpaste | tmux load-buffer -' \; paste-buffer -p -t =
